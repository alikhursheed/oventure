<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Oventure | Enterprise Delivery, AI & Operations</title>
  <meta name="description" content="Open the Oventure presentation: specialist teams, managed operations, AI agents, workflow automation and compliance readiness.">
  <meta property="og:title" content="Oventure | Enterprise Delivery, AI & Operations">
  <meta property="og:description" content="People, AI agents and operating systems for critical work.">
  <script src="go.js"></script>
  <style>
    :root{color-scheme:light}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f9f7;color:#183f35;font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(570px,calc(100% - 34px));padding:34px;border:1px solid #c6d9d0;border-radius:20px;background:#fff;box-shadow:0 20px 70px #173f3712}
    .brand{display:flex;align-items:center;gap:13px;font-size:30px;font-weight:700;letter-spacing:-1px}
    .mark{display:flex;gap:4px;height:35px;align-items:center}
    .mark i{display:block;width:7px;height:25px;background:#087f6d;transform:skewY(-15deg);border-radius:2px}.mark i:nth-child(2){height:35px}.mark i:last-child{background:#38b9a0}
    h1{font-size:clamp(32px,7vw,49px);line-height:1.08;letter-spacing:-.035em;margin:36px 0 16px}
    p{color:#4d6b61;margin:0 0 24px}
    a{display:inline-flex;min-height:48px;align-items:center;padding:12px 18px;background:#087f6d;color:#fff;text-decoration:none;border-radius:10px;font-weight:700}
    small{display:block;color:#6d837b;margin-top:24px}
  </style>
</head>
<body>
<main>
  <div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>Oventure</div>
  <h1>Opening the Oventure presentation…</h1>
  <p>Specialist teams, managed operations, AI agents, workflow automation and compliance readiness.</p>
  <a id="go" href="#">Open Oventure</a>
  <small>This permanent link opens Oventure’s public server.</small>
  <noscript><p>Please enable JavaScript, then use the button above.</p></noscript>
</main>
<script>var button=document.getElementById('go');if(window.OVENTURE_TARGET)button.href=window.OVENTURE_TARGET;</script>
</body>
</html>
